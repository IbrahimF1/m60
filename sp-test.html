<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sandpack + Pyodide smoke test</title>
<link rel="stylesheet" href="css/styles.css?v=16">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  .smoke { max-width: 780px; margin: 0 auto; padding: 48px 24px; }
  .smoke h1 { font-size: 40px; letter-spacing: -.04em; margin-bottom: 16px; }
  .smoke p { font-size: 16px; line-height: 1.5; color: rgba(0,0,0,.59); margin-bottom: 32px; }
</style>
</head>
<body>
<div class="smoke">
  <h1>Sandpack + Pyodide smoke test</h1>
  <p>
    The starter below is already solved. Press Run: the Sandpack preview should
    boot, load Pyodide, and print "All tests passed!". Edit the code to break a
    test and Run again to see the failure path.
  </p>
  <div id="mount" class="card exercise"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script type="module">
import { mountExercise } from "./js/sandpack.js?v=16";

const section = {
  id: "smoke-test",
  exercise: {
    starter: [
      "def running_sum(nums):",
      "    total, out = 0, []",
      "    for n in nums:",
      "        total += n",
      "        out.append(total)",
      "    return out",
      "",
      "# ---- tests ----",
      "assert running_sum([1, 2, 3, 4]) == [1, 3, 6, 10]",
      "assert running_sum([5]) == [5]",
      "assert running_sum([]) == []",
      'print("All tests passed!")',
      ""
    ].join("\n")
  }
};

window.__lp60Pass = (id) => console.log("PASS reported for", id);
mountExercise(document.getElementById("mount"), section);
</script>
</body>
</html>
